name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out Cove 1.3.0 build contracts
        uses: actions/checkout@v4
        with:
          repository: yourcove/cove
          ref: v1.3.0
          path: cove
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: npm ci
        working-directory: frontend
      - shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify settings endpoints
        run: dotnet run --project tests/BetterScrapers.SettingsChecks -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: better-scrapers
          path: artifacts/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.zip
          body_path: docs/release-notes/${{ github.ref_name }}.md
